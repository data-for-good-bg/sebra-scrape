[project]
name = "sebra-scrape"
version = "0.1.0"
description = "Scrape XLS files from minfin.bg transparency pages"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-api-python-client>=2.196.0",
    "requests>=2.34.2",
]

[project.scripts]
sebra-scrape = "sebra_scrape.app:main"

[tool.setuptools]
packages = [ "sebra_scrape" ]
