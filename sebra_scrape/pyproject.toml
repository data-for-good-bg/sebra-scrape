[project]
name = "sebra-scrape"
version = "0.1.0"
description = "Scrape XLS files from minfin.bg transparency pages"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gdrive-lib",
    "requests>=2.34.2",
]

[project.scripts]
sebra-scrape = "sebra_scrape.app:main"

[tool.setuptools]
packages = [ "sebra_scrape" ]

[tool.uv.sources]
gdrive-lib = { path = "../gdrive_lib", editable = true }
